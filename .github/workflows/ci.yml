name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # build first: ui's typecheck resolves @rocapine/community-core via its
      # built lib/ types, which don't exist on a fresh checkout
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check .
